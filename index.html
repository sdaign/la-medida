<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LA MEDIDA · Mapa interactivo</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#15304d;background:#edf3f8}header{padding:16px 24px;background:#15304d;color:white}h1{margin:0;font-size:28px}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:white}button{cursor:pointer;border:1px solid #bbcedb;background:white;color:#15304d;border-radius:7px;padding:10px 13px;font-size:15px}button:hover{background:#e0f2f5}#view{height:calc(100vh - 175px);min-height:350px;overflow:auto;position:relative;padding:15px;cursor:grab}#scene{transform-origin:0 0;display:inline-block;padding:35px}#space{position:relative;min-width:100%;min-height:100%}.branch{display:flex;align-items:center;gap:36px;width:max-content}.children{display:flex;flex-direction:column;gap:18px;border-left:2px solid #a8c3d4;padding-left:28px}.node{display:flex;gap:10px;align-items:center;background:white;border:2px solid #7297ad;border-radius:12px;padding:15px 17px;max-width:390px;min-width:180px;box-shadow:0 3px 8px #15304d10;cursor:default}.root>.node{background:#15304d;color:white;border-color:#15304d}.label{line-height:1.4;font-size:18px;white-space:normal;min-width:90px}.toggle{padding:3px 10px;min-width:32px;font-size:23px}.editing .label{outline:2px dashed #009ba4}footer{padding:10px 20px;font-size:14px}button:focus-visible{outline:3px solid #dc9e20}</style></head><body><header><h1>LA MEDIDA · Mapa interactivo</h1></header><nav><button id="fit">Ajustar</button><button id="plus">+</button><button id="minus">−</button><button id="reset">Cerrar todo</button><button id="next">Abrir siguiente nivel</button><button id="all">Abrir todo</button><button id="edit">Editar textos</button><button id="save">Descargar HTML</button><button id="full">Pantalla completa</button></nav><div id="view"><div id="space"><div id="scene"></div></div></div><footer>Rueda: ampliar/reducir · Arrastra el fondo para desplazarte · Pulsa + en cada rama</footer><script type="application/json" id="map-data">{"text": "LA MEDIDA", "children": [{"text": "Concepto de medir", "children": [{"text": "Definición: comparar una magnitud con su unidad", "children": [], "open": false}, {"text": "Componentes de la medida", "children": [{"text": "Valor numérico", "children": [], "open": false}, {"text": "Unidad de la magnitud", "children": [], "open": false}], "open": false}, {"text": "Tipos de magnitudes", "children": [{"text": "Magnitudes básicas", "children": [{"text": "Definición: independientes de todas las demás", "children": [], "open": false}, {"text": "Longitud, masa, tiempo, temperatura, intensidad de corriente, cantidad de materia e intensidad luminosa", "children": [], "open": false}, {"text": "Ejemplo: temperatura (no depende de otras)", "children": [], "open": false}], "open": false}, {"text": "Magnitudes derivadas", "children": [{"text": "Definición: expresadas a partir de magnitudes básicas mediante fórmulas", "children": [], "open": false}, {"text": "Ejemplos: superficie, volumen, velocidad, aceleración, fuerza, presión, trabajo y energía", "children": [], "open": false}, {"text": "Fórmula de velocidad: v = e / t", "children": [], "open": false}], "open": false}], "open": false}], "open": false}, {"text": "El Sistema Internacional (SI)", "children": [{"text": "Origen: establecido en 1960 para normalizar unidades", "children": [], "open": false}, {"text": "Uso: práctica científica y ámbito legal", "children": [], "open": false}, {"text": "Magnitudes básicas y unidades del SI", "children": [{"text": "Longitud: metro (m)", "children": [], "open": false}, {"text": "Masa: kilogramo (kg)", "children": [], "open": false}, {"text": "Tiempo: segundo (s)", "children": [], "open": false}, {"text": "Intensidad de corriente: amperio (A)", "children": [], "open": false}, {"text": "Temperatura: kelvin (K)", "children": [], "open": false}, {"text": "Cantidad de materia: mol (mol)", "children": [], "open": false}, {"text": "Intensidad luminosa: candela (cd)", "children": [], "open": false}], "open": false}, {"text": "Múltiplos y submúltiplos", "children": [{"text": "Múltiplos: exa, peta, tera, giga, mega, kilo, hecto, deca", "children": [], "open": false}, {"text": "Submúltiplos: deci, centi, mili, micro, nano, pico, femto, atto", "children": [], "open": false}], "open": false}], "open": false}, {"text": "Medidas directas e indirectas", "children": [{"text": "Medidas directas", "children": [{"text": "Definición: uso de un instrumento de medida adecuado", "children": [], "open": false}, {"text": "Ejemplos: flexómetro, regla, transportador, cronómetro, termómetro", "children": [], "open": false}], "open": false}, {"text": "Medidas indirectas", "children": [{"text": "Definición: operaciones matemáticas con magnitudes de las que dependen", "children": [], "open": false}, {"text": "Ejemplo: superficie de una pieza rectangular multiplicando sus dimensiones a y b", "children": [], "open": false}], "open": false}, {"text": "Medición comparativa", "children": [{"text": "Definición: observar diferencias con un modelo estandarizado", "children": [], "open": false}], "open": false}], "open": false}, {"text": "Instrumentos de medida", "children": [{"text": "Instrumentos manuales y mecánicos", "children": [{"text": "Flexómetro y cintas métricas", "children": [], "open": false}, {"text": "Reglas graduadas", "children": [], "open": false}, {"text": "Pie de rey", "children": [], "open": false}, {"text": "Palmer o micrómetro (con tornillo micrométrico)", "children": [], "open": false}, {"text": "Calibres (dimensiones interiores y exteriores)", "children": [], "open": false}, {"text": "Transportadores y goniómetros (ángulos)", "children": [], "open": false}, {"text": "Dinamómetro, termómetro y balanza", "children": [], "open": false}], "open": false}, {"text": "Instrumentos electromagnéticos y electromecánicos", "children": [{"text": "Cronómetro y velocímetro", "children": [], "open": false}, {"text": "Tacómetro (vueltas por unidad de tiempo)", "children": [], "open": false}, {"text": "Manómetro (presión de un fluido)", "children": [], "open": false}, {"text": "Amperímetro y voltímetro", "children": [], "open": false}], "open": false}, {"text": "Instrumentos electrónicos y digitales", "children": [{"text": "Característica: mayor precisión", "children": [], "open": false}, {"text": "Ejemplos: balanzas electrónicas, cronómetros digitales, medidores láser", "children": [], "open": false}], "open": false}], "open": false}], "open": false}</script><script>
let data=JSON.parse(document.getElementById('map-data').textContent),editing=false,zoom=1;
const view=document.getElementById('view'),space=document.getElementById('space'),scene=document.getElementById('scene');
function walk(n,f){f(n);(n.children||[]).forEach(c=>walk(c,f))}
function node(n,root=false){const b=document.createElement('div');b.className='branch'+(root?' root':'');const box=document.createElement('div');box.className='node';const label=document.createElement('span');label.className='label';label.textContent=n.text;label.contentEditable=editing?'true':'false';label.addEventListener('input',()=>n.text=label.textContent);box.append(label);if(n.children&&n.children.length){const btn=document.createElement('button');btn.className='toggle';btn.textContent=n.open?'−':'+';btn.setAttribute('aria-label',(n.open?'Cerrar ':'Abrir ')+n.text);btn.onclick=()=>{n.open=!n.open;render()};box.append(btn)}b.append(box);if(n.open&&n.children&&n.children.length){const children=document.createElement('div');children.className='children';n.children.forEach(c=>children.append(node(c)));b.append(children)}return b}
function apply(){scene.style.transform='scale('+zoom+')';space.style.width=Math.max(view.clientWidth-30,scene.offsetWidth*zoom)+'px';space.style.height=Math.max(view.clientHeight-30,scene.offsetHeight*zoom)+'px'}
function fit(){zoom=Math.max(.08,Math.min(1.2,(view.clientWidth-40)/scene.offsetWidth,(view.clientHeight-40)/scene.offsetHeight));apply();view.scrollLeft=0;view.scrollTop=0}
function render(){scene.replaceChildren(node(data,true));document.body.classList.toggle('editing',editing);apply()}
document.getElementById('fit').onclick=fit;
document.getElementById('plus').onclick=()=>{zoom=Math.min(4,zoom*1.2);apply()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.08,zoom/1.2);apply()};
document.getElementById('reset').onclick=()=>{walk(data,n=>n.open=false);render();fit()};document.getElementById('all').onclick=()=>{walk(data,n=>n.open=true);render();fit()};
document.getElementById('next').onclick=()=>{let targets=[];function visit(n,d){if(n.children&&n.children.length){if(!n.open)targets.push([n,d]);else n.children.forEach(c=>visit(c,d+1))}}visit(data,0);if(targets.length){let d=Math.min(...targets.map(x=>x[1]));targets.filter(x=>x[1]===d).forEach(x=>x[0].open=true);render();fit()}};
document.getElementById('edit').onclick=()=>{editing=!editing;document.getElementById('edit').textContent=editing?'Terminar edición':'Editar textos';render()};
document.getElementById('save').onclick=()=>{const copy=JSON.parse(JSON.stringify(data));walk(copy,n=>n.open=false);const clone=document.documentElement.cloneNode(true);clone.querySelector('#map-data').textContent=JSON.stringify(copy).replace(/</g,'\\u003c');clone.querySelector('#scene').innerHTML='';clone.querySelector('#scene').removeAttribute('style');clone.querySelector('#space').removeAttribute('style');clone.querySelector('body').classList.remove('editing');clone.querySelector('#edit').textContent='Editar textos';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};
document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})};
view.addEventListener('wheel',e=>{if(editing)return;e.preventDefault();const r=view.getBoundingClientRect(),px=e.clientX-r.left-15,py=e.clientY-r.top-15,x=(view.scrollLeft+px)/zoom,y=(view.scrollTop+py)/zoom;zoom=Math.max(.08,Math.min(4,zoom*Math.exp(-e.deltaY*(e.deltaMode===1?16:1)*.0015)));apply();view.scrollLeft=x*zoom-px;view.scrollTop=y*zoom-py},{passive:false});
let pan=null;view.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node'))return;pan={x:e.clientX,y:e.clientY,l:view.scrollLeft,t:view.scrollTop};view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(pan){view.scrollLeft=pan.l-e.clientX+pan.x;view.scrollTop=pan.t-e.clientY+pan.y}});view.addEventListener('pointerup',()=>pan=null);view.addEventListener('pointercancel',()=>pan=null);window.addEventListener('resize',fit);render();fit();
</script></body></html>
