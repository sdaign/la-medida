ay:flex;justify-content:space-between}#toast{position:fixed;bottom:45px;left:20px;background:#153958;color:white;padding:12px 18px;border-radius:9px;display:none}@media(max-width:900px){header{height:130px;gap:7px}#view{top:130px}nav button{padding:7px;font-size:12px}footer{font-size:10px}}
</style></head><body><header><div><h1>LA MEDIDA</h1><small>Mapa horizontal · Pulsa un nodo para desplegar o recoger su rama</small></div><nav><button id="next">Abrir un nivel</button><button id="all">Abrir todo</button><button id="reset">Cerrar todo</button><button id="fit">Ajustar</button><button id="minus" aria-label="Alejar">−</button><button id="plus" aria-label="Acercar">+</button><button id="edit">Editar textos</button><button id="save">Guardar HTML</button><button id="full">Pantalla completa</button></nav></header><div id="view"><div id="space"><div id="scene" style="width: 1635px; height: 1473px; transform: scale(0.513238);"></div></div></div><footer><span id="status">22 nodos visibles · Pulsa + o − en cada rama · Ajustar encuadra el mapa.</span><span>Sin conexión · Sin bibliotecas externas</span></footer><div id="toast" role="status" style="display: none;"></div>

<script>
let data=JSON.parse(document.getElementById('map-data').textContent),editing=false,zoom=1,visible=[],edges=[],maxX=0,maxY=0;
const scene=document.getElementById('scene'),view=document.getElementById('view'),space=document.getElementById('space');
function walk(node,fn){fn(node);node.children.forEach(c=>walk(c,fn))}
function tell(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function render(fit=true){scene.innerHTML='';visible=[];edges=[];let uid=0;function collect(node,depth){let e=document.createElement('div');e.className='node '+(depth===0?'root':'depth'+depth);e.style.left=(35+depth*324)+'px';e.setAttribute('role','button');e.tabIndex=0;let label=document.createElement('span');label.className='label';label.textContent=node.text;label.contentEditable=editing?'true':'false';label.spellcheck=false;label.addEventListener('input',()=>{node.text=label.textContent});label.addEventListener('click',ev=>{if(editing)ev.stopPropagation()});e.append(label);if(node.children.length){let b=document.createElement('span');b.className='badge';b.textContent=node.open?'−':'+';e.append(b);e.setAttribute('aria-expanded',node.open)}else e.setAttribute('aria-label',node.text);function toggle(){if(!editing&&node.children.length){node.open=!node.open;render()}}e.onclick=toggle;e.onkeydown=ev=>{if(!editing&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();toggle()}};scene.append(e);let o={node,e,depth,x:35+depth*324,h:e.offsetHeight,children:[]};visible.push(o);if(node.open)o.children=node.children.map(c=>collect(c,depth+1));return o}
let root=collect(data,0);function measure(o){o.span=Math.max(o.h+24,o.children.reduce((v,c)=>v+measure(c),0));return o.span}measure(root);function place(o,top){o.y=top+(o.span-o.h)/2;o.e.style.top=o.y+'px';let t=top;for(let c of o.children){place(c,t);edges.push([o,c]);t+=c.span}}place(root,28);maxX=Math.max(...visible.map(o=>o.x+264))+40;maxY=root.span+56;let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',maxX);svg.setAttribute('height',maxY);for(let [a,b]of edges){let p=document.createElementNS(svg.namespaceURI,'path');let x=a.x+264,y=a.y+a.h/2,X=b.x,Y=b.y+b.h/2;p.setAttribute('d',`M${x},${y} C${x+36},${y} ${X-36},${Y} ${X},${Y}`);p.setAttribute('stroke','#7daba8');p.setAttribute('stroke-width','2');p.setAttribute('fill','none');svg.append(p)}scene.prepend(svg);scene.style.width=maxX+'px';scene.style.height=maxY+'px';document.body.classList.toggle('editing',editing);document.getElementById('status').textContent=editing?'Edición activada: modifica los textos y pulsa Guardar HTML para conservarlos.':`${visible.length} nodos visibles · Pulsa + o − en cada rama · Ajustar encuadra el mapa.`;if(fit)fitMap();else applyZoom()}
function applyZoom(){scene.style.transform=`scale(${zoom})`;space.style.width=Math.max(view.clientWidth,maxX*zoom)+'px';space.style.height=Math.max(view.clientHeight,maxY*zoom)+'px'}
function fitMap(){zoom=Math.min(1.35,(view.clientWidth-25)/maxX,(view.clientHeight-25)/maxY);zoom=Math.max(.12,zoom);applyZoom();view.scrollLeft=0;view.scrollTop=0}
document.getElementById('fit').onclick=fitMap;document.getElementById('plus').onclick=()=>{zoom=Math.min(2.5,zoom*1.2);applyZoom()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.1,zoom/1.2);applyZoom()};document.getElementById('all').onclick=()=>{walk(data,n=>n.open=true);render()};document.getElementById('reset').onclick=()=>{walk(data,n=>n.open=false);render()};document.getElementById('next').onclick=()=>{let targets=visible.filter(o=>!o.node.open&&o.node.children.length);if(!targets.length)return;let depth=Math.min(...targets.map(o=>o.depth));targets.filter(o=>o.depth===depth).forEach(o=>o.node.open=true);render()};document.getElementById('edit').onclick=()=>{editing=!editing;document.getElementById('edit').classList.toggle('active',editing);document.getElementById('edit').textContent=editing?'Terminar edición':'Editar textos';render(false)};
document.getElementById('save').onclick=()=>{document.getElementById('map-data').textContent=JSON.stringify(data).replace(/</g,'\u003c');let clone=document.documentElement.cloneNode(true);clone.querySelector('#scene').innerHTML='';clone.querySelector('#space').removeAttribute('style');clone.querySelector('body').classList.remove('editing');clone.querySelector('#edit').classList.remove('active');clone.querySelector('#edit').textContent='Editar textos';clone.querySelector('#toast').style.display='none';let blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='La_medida_interactiva.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);tell('HTML guardado con tus textos y el estado de las ramas.')};
document.getElementById('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){tell('Usa la opción de pantalla completa del navegador.')}};window.addEventListener('resize',fitMap);render();
view.addEventListener('wheel',function(e){if(editing)return;e.preventDefault();const r=view.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,x=(view.scrollLeft+px)/zoom,y=(view.scrollTop+py)/zoom;zoom=Math.max(.1,Math.min(4,zoom*Math.exp(-e.deltaY*(e.deltaMode===1?16:1)*.0015)));applyZoom();view.scrollLeft=x*zoom-px;view.scrollTop=y*zoom-py},{passive:false});
let pan=null;view.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node'))return;pan={x:e.clientX,y:e.clientY,l:view.scrollLeft,t:view.scrollTop};view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',e=>{if(pan){view.scrollLeft=pan.l-e.clientX+pan.x;view.scrollTop=pan.t-e.clientY+pan.y}});view.addEventListener('pointerup',()=>pan=null);view.addEventListener('pointercancel',()=>pan=null);

</script></body></html>
